[package]
name = "modrinth-cli"
version = "0.1.0"
edition = "2024"
description = "Modrinth App as a CLI in Rust including most of the important features"
authors = ["Paul8711 <contact@paul8711.com>"]
license = "AGPL-3.0-only"
repository = "https://github.com/paul8711-code/modrinth-cli"

[[bin]]
name = "mr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
dialoguer = "0.12.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["blocking", "query"] }
